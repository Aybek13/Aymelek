<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Teşekkürler · AYMELEK Demo</title>
<link rel="icon" href="logo-light.png">
<style>
* { box-sizing: border-box }
body { margin:0; min-height:100svh; display:grid; place-items:center; padding:1rem; color:#fff1f8; font:1rem/1.55 system-ui,sans-serif; background:radial-gradient(ellipse at 50% 24%,#382037,#100b14 65%) }
main { width:min(100%,30rem); padding:clamp(1rem,5vw,2.5rem); text-align:center; background:#211424; border:1px solid #754461; border-radius:1.5rem }
.demo { margin:0; color:#efd0e2; font-size:.875rem }
.celebration { position:relative; display:grid; place-items:center; margin:1rem auto .5rem; width:min(100%,15rem); height:10rem; perspective:700px }
.logo { display:block; width:9rem; max-width:80%; height:auto }
.star { position:absolute; left:50%; top:50%; opacity:0; color:#ffc6e3; pointer-events:none }
.play .logo { animation:turn 1.5s ease-in-out both }
.play .star { animation:scatter 1.2s ease-out .2s both }
@keyframes turn { to { transform:rotateY(360deg) } }
@keyframes scatter { 18% { opacity:1 } to { transform:translate(var(--x),var(--y)) scale(.5); opacity:0 } }
h1 { margin:.25rem 0; font:clamp(2.25rem,9vw,3rem) Georgia,serif }
#message { min-height:5.5rem; margin:.75rem 0 1.25rem; color:#ffc8e3; display:grid; place-items:center }
button { padding:.7rem 1rem; min-height:44px; border:0; border-radius:.75rem; background:#ffc6e3; color:#251024; font:600 1rem system-ui,sans-serif; cursor:pointer }
button:focus-visible,a:focus-visible { outline:2px solid #fff; outline-offset:4px }
a { display:inline-block; margin-top:1rem; color:#efd0e2 }
@media(prefers-reduced-motion:reduce) { .play .logo,.play .star { animation:none } }
</style>
</head>
<body>
<main>
<p class="demo">Demo · Gerçek ödeme alınmaz.</p>
<div class="celebration">
<img class="logo" src="logo-light.png" alt="AYMELEK">
<span class="star" style="--x:-97px;--y:-44px" aria-hidden="true">✦</span>
<span class="star" style="--x:103px;--y:-56px" aria-hidden="true">✧</span>
<span class="star" style="--x:-112px;--y:32px" aria-hidden="true">✧</span>
<span class="star" style="--x:100px;--y:38px" aria-hidden="true">✦</span>
<span class="star" style="--x:20px;--y:-77px" aria-hidden="true">✦</span>
</div>
<h1>Teşekkürler!</h1>
<p id="message" role="status"></p>
<button type="button" id="new-demo">Yeni örnek göster</button>
<br><a href="index.html">AYMELEK ana sayfası</a>
</main>
<script>
const messages = [
  'Tarzın sana, bu küçük kutlama bizden. AYMELEK’i seçtiğin için teşekkürler!',
  'Kendine güzel bir şey seçtin. Güle güle kullan!',
  'Bugün kendine küçük bir sürpriz yaptın. Umarız paketi açtığında yüzün güler.',
  'Güzel günlerde kullan! Alışverişine AYMELEK’i kattığın için teşekkürler.'
];
const storageKey = 'aymelek-thanks-demo';
const celebration = document.querySelector('.celebration');
const message = document.getElementById('message');
let current = Math.floor(Math.random() * messages.length);
try {
  const saved = sessionStorage.getItem(storageKey);
  if (saved !== null && /^[0-3]$/.test(saved)) current = Number(saved);
} catch {
  // Keep the preview usable when browser storage is disabled.
}
function showExample() {
  try { sessionStorage.setItem(storageKey, String(current)); } catch {}
  message.textContent = messages[current];
  celebration.classList.remove('play');
  void celebration.offsetWidth;
  celebration.classList.add('play');
}
document.getElementById('new-demo').addEventListener('click', () => {
  current = (current + 1 + Math.floor(Math.random() * (messages.length - 1))) % messages.length;
  showExample();
});
showExample();
</script>
</body>
</html>
