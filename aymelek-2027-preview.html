<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AYMELEK — Motion Design Önizleme</title><style>html{scroll-behavior:smooth}body{margin:0;background:#110b14;color:#fff;font-family:Inter,Arial,sans-serif}*{box-sizing:border-box}.preview-header{position:relative;z-index:10;display:flex;align-items:center;justify-content:space-between;padding:16px 5vw;background:#160f19;border-bottom:1px solid #ffffff21}.preview-brand{font:500 1.5rem Georgia,serif;letter-spacing:.2em;color:#f6c6dc}.preview-header a{color:#f6c6dc;font-size:.8rem}.preview-note{background:#4a1e38;color:#fff;padding:10px 5vw;font-size:.76rem;line-height:1.6} /* AYMELEK original fashion motion — no 3D product display */
.aym-motion{background:#110b14;color:#fff5fb;overflow:clip;font-family:Inter,system-ui,sans-serif}.aym-motion *{box-sizing:border-box}.aym-motion a{text-decoration:none}.aym-eyebrow{font:600 .7rem/1.4 Inter,system-ui,sans-serif!important;letter-spacing:.28em;color:#f0a6c8!important}.aym-motion h2{font:400 clamp(3.1rem,7vw,7.8rem)/1.02 Georgia,serif;letter-spacing:-.065em}.aym-motion h2 em{color:#eeb0cd;font-weight:400}.aym-pill{display:inline-flex;gap:1.5rem;align-items:center;justify-content:center;background:#f4c0d8;color:#21101d!important;min-height:54px;padding:0 1.65rem;border-radius:30px;font:600 .78rem Inter,system-ui,sans-serif;letter-spacing:.1em;transition:background .2s,transform .2s}.aym-pill:hover{background:#fff;transform:translateY(-3px)}.aym-intro{min-height:85vh;position:relative;isolation:isolate;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:6rem 1.5rem;background:radial-gradient(ellipse at 50% 45%,#713a62 0%,#2b192d 42%,#100b14 78%)}.aym-intro-glow{position:absolute;inset:12%;border:1px solid #f8b8d540;border-radius:50%;filter:blur(1px);z-index:-1;transform:scaleX(.65);box-shadow:0 0 150px #d77ca74d,inset 0 0 150px #f0b3d124}.aym-intro h2{margin:1.4rem 0}.aym-intro>p:not(.aym-eyebrow){color:#e8c9db;margin:0 0 2.2rem}.aym-intro-rule{height:1px;width:clamp(120px,30vw,450px);background:#eab5ce55;margin-top:4rem}.aym-scroll-hint{font-size:.65rem;letter-spacing:.3em;color:#d5afc6;margin-top:1.4rem}.aym-story{height:195vh;position:relative}.aym-story-sticky{height:100vh;position:sticky;top:0;display:grid;grid-template-columns:55% 45%;overflow:hidden;background:#e8c6d9;color:#23101f}.aym-story-visual{position:relative;overflow:hidden;background:#66314d}.aym-story-photo{position:absolute;width:100%;height:100%;object-fit:cover;object-position:center 32%;transform:scale(calc(1 + var(--scene,0)*.28)) translateY(calc(var(--scene,0)*-5%));will-change:transform}.aym-story-photo-two{clip-path:inset(calc((1 - var(--scene,0))*100%) 0 0 0);transform:scale(calc(1.16 - var(--scene,0)*.16)) translateY(calc((1 - var(--scene,0))*7%))}.aym-story-content{padding:clamp(2rem,7vw,8rem);display:flex;flex-direction:column;justify-content:center;align-items:start;position:relative;z-index:2}.aym-story-content .aym-eyebrow{color:#983e71!important}.aym-story-content h2{font-size:clamp(3rem,6vw,6rem);margin:1.5rem 0}.aym-story-content>p:not(.aym-eyebrow){max-width:28rem;line-height:1.8;color:#583448}.aym-text-link{color:#311627!important;font-size:.77rem;letter-spacing:.14em;border-bottom:1px solid #311627;padding-bottom:.7rem;margin-top:2rem}.aym-story-progress{position:absolute;right:0;top:0;height:100%;width:3px;background:#5c2c4a35}.aym-story-progress span{display:block;width:100%;height:calc(var(--scene,0)*100%);background:#9c3b73}.aym-lookbook{padding:clamp(4rem,8vw,8rem) 5vw 5rem;background:#110b14}.aym-lookbook-heading{max-width:1200px;margin:0 auto 3rem;display:flex;align-items:end;justify-content:space-between;gap:2rem}.aym-lookbook-heading h2{font-size:clamp(3rem,6vw,6.5rem);margin-top:1rem}.aym-lookbook-heading>p{max-width:18rem;color:#d6b6ca;line-height:1.7}.aym-lookbook-stage{position:relative;max-width:1200px;margin:auto;height:clamp(520px,66vw,780px);background:#342033;overflow:hidden;border-radius:8px}.aym-lookbook-image{position:absolute;inset:0}.aym-lookbook-image img{width:100%;height:100%;object-fit:cover;object-position:center 32%;transform:scale(1.02);opacity:1;transition:transform .7s cubic-bezier(.2,.7,.2,1),opacity .45s}.aym-lookbook-stage.is-transitioning img{opacity:.25;transform:scale(1.1) translateX(3%)}.aym-lookbook-shade{position:absolute;inset:0;background:linear-gradient(90deg,#130c17c9,transparent 78%),linear-gradient(0deg,#130c17a9,transparent 50%);pointer-events:none}.aym-lookbook-caption{position:absolute;left:clamp(1.5rem,6vw,6rem);bottom:clamp(2rem,6vw,5rem);z-index:2}.aym-lookbook-caption>span,.aym-lookbook-caption>p{font-size:.73rem;letter-spacing:.22em;color:#f5c7dc}.aym-lookbook-caption h3{font:400 clamp(3rem,6vw,6rem)/1 Georgia,serif;margin:.9rem 0 1.7rem}.aym-lookbook-actions{position:absolute;right:clamp(1rem,4vw,4rem);bottom:clamp(1.5rem,5vw,4rem);z-index:3;display:flex;gap:.7rem}.aym-lookbook-actions button{width:55px;height:55px;border-radius:50%;background:#ffffff12;border:1px solid #f4c0d8;color:#fff;cursor:pointer;font-size:1.4rem}.aym-lookbook-actions button:hover{background:#a83f78}.aym-lookbook-dots{display:flex;gap:.6rem;justify-content:center;padding:1.6rem}.aym-lookbook-dots button{border:0;background:#73536b;width:34px;height:5px;border-radius:10px;cursor:pointer}.aym-lookbook-dots button[aria-current=true]{background:#f3b8d2}.aym-finale{min-height:55vh;padding:5rem 1rem;display:flex;align-items:center;justify-content:center;flex-direction:column;text-align:center;background:radial-gradient(ellipse at 50% 100%,#532747,#110b14 70%)}.aym-finale h2{margin:1.4rem 0 2rem}@media(max-width:760px){.aym-intro{min-height:75vh}.aym-story{height:auto}.aym-story-sticky{height:auto;position:relative;display:flex;flex-direction:column}.aym-story-visual{height:390px;width:100%}.aym-story-content{padding:3rem 1.5rem 4rem}.aym-lookbook-heading{display:block}.aym-lookbook-heading>p{margin-top:1rem}.aym-lookbook-stage{height:640px}.aym-lookbook-caption{bottom:7rem;left:1.5rem}.aym-lookbook-actions{right:1.5rem;bottom:1.5rem}.aym-lookbook-caption h3{font-size:3.3rem}.aym-story-photo-two{clip-path:inset(45% 0 0 0)}}@media(prefers-reduced-motion:reduce){.aym-motion *, .aym-motion *:before,.aym-motion *:after{animation:none!important;transition:none!important}.aym-story-photo-two{clip-path:inset(45% 0 0 0)}}</style></head><body><header class="preview-header"><div class="preview-brand">AYMELEK</div><a href="https://aybek13.github.io/aymelek/">Mevcut site ↗</a></header><div class="preview-note">TASARIM ÖNİZLEMESİ · Satış işlemi ve ödeme bu önizlemede etkin değildir. Canlı AYMELEK sitesi değiştirilmedi.</div><main id="aymelek-motion-root"></main><script>const previewBase='https://aybek13.github.io/aymelek/';document.querySelector('main').addEventListener('click',e=>{const a=e.target.closest('a');if(a&&a.getAttribute('href')&&!a.href.startsWith('http')){e.preventDefault();location.href=previewBase+a.getAttribute('href')}});</script><script>(()=>{'use strict';const root=document.getElementById('aymelek-motion-root');if(!root)return;
const looks=[{title:'Şehrin ritmi',sub:'KADIN GİYİM',img:'https://aybek13.github.io/aymelek/hero-woman.jpg',href:'products.html?cat=dresses'},{title:'Özgür adımlar',sub:'AYAKKABI',img:'https://aybek13.github.io/aymelek/shoe-assets/sneaker-1.webp',href:'products.html?cat=shoes'},{title:'İnce dokunuş',sub:'AKSESUAR',img:'https://aybek13.github.io/aymelek/showcase-photos/1.jpg',href:'products.html?cat=accessories'}];
root.innerHTML=`<div class="aym-motion">
<section class="aym-intro" id="yeni-koleksiyon"><div class="aym-intro-glow"></div><p class="aym-eyebrow">AYMELEK — THE NEW EDIT</p><h2>Bir görünümden<br><em>çok daha fazlası.</em></h2><p>Moda, hareket ettikçe kendini gösterir.</p><a class="aym-pill" href="products.html">KOLEKSİYONU KEŞFET <span aria-hidden="true">↗</span></a><div class="aym-intro-rule"></div><span class="aym-scroll-hint">AŞAĞI KAYDIR ↓</span></section>
<section class="aym-story" id="aymelek-hikayesi"><div class="aym-story-sticky"><div class="aym-story-visual"><img class="aym-story-photo aym-story-photo-one" src="https://aybek13.github.io/aymelek/hero-woman.jpg" alt="AYMELEK moda hikâyesi" loading="lazy"><img class="aym-story-photo aym-story-photo-two" src="https://aybek13.github.io/aymelek/showcase-photos/1.jpg" alt="" loading="lazy"></div><div class="aym-story-content"><p class="aym-eyebrow">01 / OUR STORY</p><h2>Her detayda<br><em>sen varsın.</em></h2><p>Kendini ifade etmenin tek bir yolu yok. AYMELEK'te her yeni sezon, senin hikâyenle başlıyor.</p><a class="aym-text-link" href="about.html">HİKÂYEMİZİ KEŞFET ↗</a></div><div class="aym-story-progress" aria-hidden="true"><span></span></div></div></section>

<section class="aym-finale"><p class="aym-eyebrow">AYMELEK / DISCOVER MORE</p><h2>Yeni favorin<br><em>seni bekliyor.</em></h2><a class="aym-pill" href="products.html">ALIŞVERİŞE BAŞLA ↗</a></section>
</div>`;
const reduced=matchMedia('(prefers-reduced-motion: reduce)');const story=root.querySelector('.aym-story'),visual=root.querySelector('.aym-story-visual'),sticky=root.querySelector('.aym-story-sticky');
function scrollStory(){if(reduced.matches)return;const box=story.getBoundingClientRect();const range=Math.max(1,story.offsetHeight-innerHeight);const p=Math.min(1,Math.max(0,-box.top/range));visual.style.setProperty('--scene',p.toFixed(4));sticky.style.setProperty('--scene',p.toFixed(4))}
addEventListener('scroll',scrollStory,{passive:true});addEventListener('resize',scrollStory);scrollStory();
const stage=root.querySelector('.aym-lookbook-stage'),photo=root.querySelector('#aym-look-img'),dots=root.querySelector('.aym-lookbook-dots');let active=0,timer=0;
looks.forEach((_,i)=>{const b=document.createElement('button');b.type='button';b.setAttribute('aria-label','Görünüm '+(i+1));b.addEventListener('click',()=>select(i));dots.append(b)});
function select(i){active=(i+looks.length)%looks.length;clearTimeout(timer);stage.classList.add('is-transitioning');const paint=()=>{const l=looks[active];photo.src=l.img;photo.alt=l.sub+' koleksiyon görünümü';root.querySelector('#aym-look-title').textContent=l.title;root.querySelector('#aym-look-sub').textContent=l.sub;root.querySelector('#aym-look-index').textContent=String(active+1).padStart(2,'0')+' / 03';root.querySelector('#aym-look-link').href=l.href;[...dots.children].forEach((b,j)=>b.setAttribute('aria-current',String(j===active)));stage.classList.remove('is-transitioning')};if(reduced.matches)paint();else timer=setTimeout(paint,250)}
root.querySelector('#aym-look-prev').addEventListener('click',()=>select(active-1));root.querySelector('#aym-look-next').addEventListener('click',()=>select(active+1));let x=null;stage.addEventListener('touchstart',e=>{x=e.touches[0].clientX},{passive:true});stage.addEventListener('touchend',e=>{if(x===null)return;const delta=e.changedTouches[0].clientX-x;if(Math.abs(delta)>55)select(active+(delta<0?1:-1));x=null},{passive:true});select(0);
})();</script></body></html>
