<!doctype html>
<html lang="tr">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="AYMELEK İlkbahar Yaz 2027 defilesi. Altı kombini etkileşimli podyumda keşfedin.">
<title>Defile · AYMELEK</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#100b14;color:#fff2fa;font:1rem system-ui,sans-serif}a{color:inherit}button{font:inherit;color:inherit;cursor:pointer}header,footer{max-width:90rem;margin:auto;padding:1.2rem clamp(1rem,4vw,4rem);display:flex;justify-content:space-between;align-items:center;gap:1rem}header a{text-decoration:none}.brand{font:1.4rem Georgia,serif;letter-spacing:.24em;color:#ffc2df}.home:hover{text-decoration:underline}main{max-width:90rem;margin:auto;padding:0 clamp(1rem,4vw,4rem)}.grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(15rem,24%);gap:1rem}.stage{position:relative;isolation:isolate;overflow:hidden;min-height:32rem;height:min(72svh,48rem);border:1px solid #63334f;border-radius:1rem;touch-action:pan-y;user-select:none;cursor:grab;background:radial-gradient(ellipse at 69% 64%,#a24d7e 0%,#4a254c 38%,#171020 76%)}.stage:active{cursor:grabbing}.stars,.line{position:absolute;inset:0}.stars{pointer-events:none}.stars i{position:absolute;border-radius:50%;background:#ffe2f3;box-shadow:0 0 8px #fb91cc}.line{pointer-events:none}.model{position:absolute;left:0;top:0;transform-origin:top left;pointer-events:auto}.model svg,.piece svg{display:block;width:100%;height:100%}.caption{position:absolute;left:clamp(1rem,4vw,3rem);top:clamp(1rem,4vw,3rem);pointer-events:none;z-index:110;text-shadow:0 2px 12px #100b14}.caption p{margin:0;color:#ffd2e8}.caption h1{font:clamp(1.8rem,4.6vw,4.5rem)/.96 Georgia,serif;margin:.55rem 0 0;max-width:8ch}.controls{position:absolute;z-index:110;left:1rem;bottom:1rem;display:flex;align-items:center;gap:.55rem;padding:.4rem;border-radius:4rem;background:#211124e8;border:1px solid #b36d99}.controls button{width:2.75rem;height:2.75rem;border:0;border-radius:50%;background:#552b4c;font-size:1.25rem}.controls button:hover{background:#844266}.counter{min-width:5.5rem;text-align:center;font-variant-numeric:tabular-nums}.rail{border:1px solid #63334f;border-radius:1rem;background:#201322;padding:1rem;display:grid;grid-template-rows:auto repeat(2,minmax(0,1fr));gap:.7rem}.rail h2{font:1.2rem Georgia,serif;margin:0 0 .15rem;color:#ffd2e8}.piece{display:grid;grid-template-rows:minmax(0,1fr) auto;min-height:0;margin:0;border-radius:.65rem;overflow:hidden;background:#fae8f3;color:#30162c}.piece svg{padding:.7rem;max-height:16rem;mix-blend-mode:multiply}.piece figcaption{padding:.6rem .8rem;font-size:.9rem;font-weight:600}.fallback{position:absolute;z-index:111;left:1rem;right:1rem;bottom:5rem;padding:.8rem;background:#281529;border-radius:.5rem}footer a{color:#ffc2df}:focus-visible{outline:2px solid #ffb1dc;outline-offset:4px}@media(max-width:720px){.grid{grid-template-columns:1fr}.stage{height:56svh;min-height:21rem}.rail{grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:auto 9rem}.rail h2{grid-column:1/-1}footer{align-items:flex-start;flex-direction:column}}
</style>
<header><a class="brand" href="./">AYMELEK</a><a class="home" href="./">Mağaza</a></header>
<main>
<div class="grid">
<section class="stage" id="stage" tabindex="0" aria-label="Defile. Sürükleyin veya yön tuşlarını kullanın.">
<div class="stars" id="stars" aria-hidden="true"></div><div class="line" id="line" aria-hidden="true"></div>
<div class="caption"><p>İlkbahar / Yaz 2027</p><h1>AYMELEK Defile</h1></div>
<div class="controls"><button type="button" id="prev" aria-label="Önceki kombin">‹</button><span class="counter" id="counter" role="status"></span><button type="button" id="next" aria-label="Sonraki kombin">›</button></div>
<p class="fallback" id="fallback" hidden>Podyum görselleri yüklenemedi. Kombin parçalarını inceleyebilir veya mağazaya dönebilirsiniz.</p>
</section>
<aside class="rail" aria-label="Kombin parçaları"><h2>Kombinin parçaları</h2><figure class="piece"></figure><figure class="piece"></figure></aside>
</div>
</main>
<footer><span>Kombini değiştirmek için podyumu sürükleyin.</span><a href="./">AYMELEK mağazasını keşfet</a></footer>
<script>
const models = 'https://images.higgs.ai/?default=1&output=webp&url=https%3A%2F%2Fd8j0ntlcm91z4.cloudfront.net%2Fuser_38xzZboKViGWJOttwIXH07lWA1P%2Fhf_20261102_042056_1a704ff7-b0e5-4a9f-bbda-62392b819fb6.png&w=3840&q=85';
const pieces = 'https://images.higgs.ai/?default=1&output=webp&url=https%3A%2F%2Fd8j0ntlcm91z4.cloudfront.net%2Fuser_38xzZboKViGWJOttwIXH07lWA1P%2Fhf_20261102_042057_080e85b0-b4aa-4072-8eb9-2304c7baf42b.png&w=2400&q=85';
const looks = [[12,176],[178,330],[331,470],[476,633],[634,767],[767,956]];
const items = [
  [26,224,28,214,'Tüylü ceket'],[304,412,22,236,'Saten geniş paça pantolon'],
  [530,666,12,242,'Pileli elbise'],[752,922,100,146,'Altın tonlu kemer'],
  [70,176,246,466,'Saten trençkot elbise'],[294,422,294,432,'El çantası'],
  [508,688,240,452,'Balon kollu bluz'],[780,890,252,466,'Kuşaklı pantolon'],
  [64,178,484,698,'Pudra uzun kaban'],[316,396,482,698,'Fildişi düz paça pantolon'],
  [530,672,508,682,'Fırfırlı üst'],[754,916,484,700,'Pileli maksi etek']
];
const stops = [
  [1.16,1.08,1.04,0,0],[.76,.94,.83,0,1],[.54,.83,.61,1,1],
  [.39,.76,.47,2,1],[.28,.71,.36,4,.82],[.20,.67,.28,6,.51],[.14,.64,.22,8,.24]
];
const get = id => document.getElementById(id);
const wrap = (value, count) => ((value % count) + count) % count;
const reduced = matchMedia('(prefers-reduced-motion: reduce)');
const stage = get('stage');
const slots = [...document.querySelectorAll('.piece')];

function crop(source, x, y, width, height, sheetWidth, sheetHeight) {
  const namespace = 'http://www.w3.org/2000/svg';
  const svg = document.createElementNS(namespace, 'svg');
  svg.setAttribute('viewBox', [x,y,width,height].join(' '));
  svg.setAttribute('aria-hidden', 'true');
  const image = document.createElementNS(namespace, 'image');
  image.setAttribute('href', source);
  image.setAttribute('width', sheetWidth);
  image.setAttribute('height', sheetHeight);
  svg.append(image);
  return svg;
}

const modelsOnStage = looks.map(([left,right], index) => {
  const node = document.createElement('div');
  node.className = 'model';
  node.dataset.look = index;
  node.append(crop(models,left,48,right-left,448,960,540));
  get('line').append(node);
  return {node, aspect:(right-left)/448};
});

for (let index = 0; index < 46; index++) {
  const star = document.createElement('i');
  const size = index % 8 === 0 ? 3 : 1.5;
  Object.assign(star.style,{
    left: (index * 83.13 % 100) + '%', top: (index * 43.71 % 100) + '%',
    width: size + 'px', height: size + 'px', opacity: .24 + index % 5 * .13
  });
  get('stars').append(star);
}

let position = 0;
let target = 0;
let animation = 0;
let previousTime = 0;
let selected = -1;
let drag = null;

function paint() {
  const width = stage.clientWidth;
  const height = stage.clientHeight;
  modelsOnStage.forEach(({node,aspect}, index) => {
    const offset = wrap(index-position+1,looks.length)-1;
    const depth = offset + 1;
    const lower = Math.floor(depth);
    const upper = Math.min(lower + 1, stops.length - 1);
    const mix = column => stops[lower][column] + (stops[upper][column]-stops[lower][column])*(depth-lower);
    const modelHeight = mix(2)*height;
    const modelWidth = modelHeight*aspect;
    node.style.width = modelWidth+'px';
    node.style.height = modelHeight+'px';
    node.style.transform = 'translate3d('+(mix(0)*width-modelWidth/2)+'px,'+(mix(1)*height-modelHeight)+'px,0)';
    node.style.zIndex = 100 - Math.round(depth*10);
    node.style.filter = 'blur('+mix(3)+'px)';
    node.style.opacity = mix(4);
    node.style.pointerEvents = mix(4) < .18 ? 'none' : 'auto';
  });

  const active = wrap(Math.round(position),looks.length);
  if (active === selected) return;
  selected = active;
  get('counter').textContent = 'Kombin '+(active+1)+' / '+looks.length;
  slots.forEach((slot,index) => {
    const [left,right,top,bottom,name] = items[active*2+index];
    const label = document.createElement('figcaption');
    label.textContent = name;
    slot.replaceChildren(crop(pieces,left,top,right-left,bottom-top,960,720),label);
  });
}

function animate(time) {
  const elapsed = previousTime ? Math.min(45,time-previousTime) : 16;
  previousTime = time;
  position += (target-position)*(1-Math.exp(-elapsed/115));
  if (Math.abs(target-position)<.001) position = target;
  paint();
  animation = position === target ? 0 : requestAnimationFrame(animate);
  if (!animation) previousTime = 0;
}

function move(value) {
  target = value;
  if (reduced.matches) {
    position = target;
    paint();
  } else if (!animation) animation = requestAnimationFrame(animate);
}

function step(direction) { move(Math.round(target)+direction); }
get('prev').addEventListener('click',()=>step(-1));
get('next').addEventListener('click',()=>step(1));
stage.addEventListener('keydown',event=>{
  if (!['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(event.key)) return;
  event.preventDefault();
  step(['ArrowRight','ArrowDown'].includes(event.key) ? 1 : -1);
});
stage.addEventListener('pointerdown',event=>{
  if (!event.isPrimary || event.button !== 0 || event.target.closest('button')) return;
  drag = {id:event.pointerId, x:event.clientX, start:Math.round(target), distance:0, model:event.target.closest('.model')};
  stage.setPointerCapture(event.pointerId);
});
stage.addEventListener('pointermove',event=>{
  if (drag?.id !== event.pointerId) return;
  const pixels = event.clientX-drag.x;
  drag.distance = Math.max(drag.distance,Math.abs(pixels));
  if (drag.distance>=7) move(drag.start-pixels/Math.max(90,stage.clientWidth*.19));
});
function finishDrag(event) {
  if (drag?.id !== event.pointerId) return;
  const {distance,model,start,x} = drag;
  drag = null;
  if (event.type !== 'pointerup') { move(start); return; }
  if (distance>=7) {
    const next = Math.round(target);
    move(next === start && distance>=30 ? start+Math.sign(x-event.clientX) : next);
  } else if (model) {
    move(start+wrap(Number(model.dataset.look)-start,looks.length));
  }
}
stage.addEventListener('pointerup',finishDrag);
stage.addEventListener('pointercancel',finishDrag);
stage.addEventListener('lostpointercapture',finishDrag);
let wheelTimer;
stage.addEventListener('wheel',event=>{
  if (event.ctrlKey) return;
  const delta = Math.abs(event.deltaX)>Math.abs(event.deltaY) ? event.deltaX : event.deltaY;
  if (!delta) return;
  event.preventDefault();
  if (!wheelTimer) step(Math.sign(delta));
  clearTimeout(wheelTimer);
  wheelTimer=setTimeout(()=>{wheelTimer=0},145);
},{passive:false});
const sprite = new Image();
sprite.onerror = () => {get('fallback').hidden = false};
sprite.src = models;
new ResizeObserver(paint).observe(stage);
paint();
</script>
</html>
